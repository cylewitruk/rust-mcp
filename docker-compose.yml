services:
  postgres:
    image: postgres:17-alpine
    container_name: rust-mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rust_mcp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rust_mcp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rust-mcp-net

  rust-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust-mcp-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/rust_mcp}
      MCP_HTTP_BIND: ${MCP_HTTP_BIND:-0.0.0.0:43173}
      MCP_SSE_KEEP_ALIVE_SECS: ${MCP_SSE_KEEP_ALIVE_SECS:-15}
      MCP_SSE_RETRY_MS: ${MCP_SSE_RETRY_MS:-3000}
      CRATES_IO_BASE_URL: ${CRATES_IO_BASE_URL:-https://crates.io}
      CRATES_IO_USER_AGENT: "${CRATES_IO_USER_AGENT:-rust-mcp/0.1.0 (local dev machine)}"
      CRATES_IO_TIMEOUT_SECS: ${CRATES_IO_TIMEOUT_SECS:-20}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      CARGO_REGISTRY_DIR: /cargo/registry
      MCP_DATA_DIR: /var/lib/rust-mcp
      RUST_LOG: ${RUST_LOG:-info,rust_mcp=debug,sqlx=warn}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-43173}:43173"
    volumes:
      - ${HOME}/.cargo/registry:/cargo/registry:ro
      - mcp_data:/var/lib/rust-mcp
    networks:
      - rust-mcp-net

volumes:
  pg_data:
  mcp_data:

networks:
  rust-mcp-net:
    driver: bridge
