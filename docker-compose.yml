services:
  rust-mcp:
    image: rust-mcp
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust-mcp-server
    restart: unless-stopped
    environment:
      # Entrypoint only (not read by the server binary)
      # ------------------------------------------------------------------------
      OUTBOUND_FIREWALL: ${OUTBOUND_FIREWALL:-true}
      OUTBOUND_ALLOWLIST: ${OUTBOUND_ALLOWLIST:-crates.io,static.crates.io,docs.rs,api.osv.dev,api.github.com}
      
      # Server configuration
      # ------------------------------------------------------------------------
      # Server default is 127.0.0.1 for running outside of Docker
      MCP_HTTP_BIND: ${MCP_HTTP_BIND:-0.0.0.0:43173}

      # Logging
      # ------------------------------------------------------------------------
      RUST_LOG: ${RUST_LOG:-info,rust_mcp=debug,sqlx=warn,bollard=warn,reqwest=warn}
    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-43173}:43173"
    volumes:
      - ${HOME}/.cargo/registry:/cargo/registry:ro
      - mcp_data:/var/lib/rust-mcp
      - pg_data:/var/lib/postgresql/data

volumes:
  mcp_data:
  pg_data:
