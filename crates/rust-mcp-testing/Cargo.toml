[package]
name = "rust-mcp-testing"
version = "0.1.0"
edition = "2024"
description = "Shared test harnesses for rust-mcp"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }
zstd = { workspace = true }
rust-mcp-types = { workspace = true }

[lints.rust]
missing_docs = "warn"
unused_imports = "warn"

[lints.clippy]
unused_trait_names = "deny"
unwrap_in_result = "warn"
empty_loop = "deny"
