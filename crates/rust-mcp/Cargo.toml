[package]
name = "rust-mcp"
version = "0.1.0"
edition = "2024"
description = "Local-first Rust dependency intelligence MCP server"
license = "MIT OR Apache-2.0"

[features]
integration-tests = []
e2e-tests = []

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.1", features = ["http-listener"] }
rmcp = { version = "0.15.0", features = ["transport-streamable-http-server"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate"] }
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.9.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
rustdoc-types = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
rust-mcp-testing = { path = "../rust-mcp-testing" }

[[test]]
name = "postgres_integration"
path = "tests/postgres_integration.rs"
required-features = ["integration-tests"]

[[test]]
name = "core_tools_integration"
path = "tests/core_tools_integration.rs"
required-features = ["integration-tests"]

[[test]]
name = "crate_tools_integration"
path = "tests/crate_tools_integration.rs"
required-features = ["integration-tests"]

[[test]]
name = "source_tools_integration"
path = "tests/source_tools_integration.rs"
required-features = ["integration-tests"]

[[test]]
name = "symbol_tools_integration"
path = "tests/symbol_tools_integration.rs"
required-features = ["integration-tests"]

[[test]]
name = "docs_tools_integration"
path = "tests/docs_tools_integration.rs"
required-features = ["integration-tests"]

[[test]]
name = "dependency_tools_integration"
path = "tests/dependency_tools_integration.rs"
required-features = ["integration-tests"]

[[test]]
name = "index_tools_integration"
path = "tests/index_tools_integration.rs"
required-features = ["integration-tests"]

[[test]]
name = "e2e_http"
path = "tests/e2e_http.rs"
required-features = ["e2e-tests"]

[lints.rust]
missing_docs = "warn"
unused_imports = "warn"

[lints.clippy]
unused_trait_names = "deny"
unwrap_in_result = "warn"
empty_loop = "deny"
