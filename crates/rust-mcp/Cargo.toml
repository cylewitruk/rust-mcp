[package]
name = "rust-mcp"
version = "0.1.0"
edition = "2024"
description = "Local-first Rust dependency intelligence MCP server"
license = "MIT OR Apache-2.0"
autotests = false

[features]
integration-tests = ["testing"]
e2e-tests = ["testing"]
live-tests = ["testing"]
testing = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
rmcp = { workspace = true }
reqwest = { workspace = true }
quote = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
rustdoc-types = { workspace = true }
rust-mcp-types = { workspace = true }
tracing-subscriber = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
rust-mcp-testing = { workspace = true }
test-log = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
required-features = ["integration-tests"]

[[test]]
name = "live"
path = "tests/live/mod.rs"
required-features = ["live-tests"]

[[test]]
name = "e2e_http"
path = "tests/e2e/mod.rs"
required-features = ["e2e-tests"]

[lints.rust]
missing_docs = "warn"
unused_imports = "warn"

[lints.clippy]
unused_trait_names = "deny"
unwrap_in_result = "warn"
empty_loop = "deny"
