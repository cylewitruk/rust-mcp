[workspace]
resolver = "3"
members = [
    "crates/*",
]

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.23.1"
cargo_toml = "1.0.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures = "0.3.34"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", features = ["http-listener"] }
rmcp = { version = "3.7.0", features = ["transport-streamable-http-server"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate"] }
syn = { version = "3.0.9", features = ["full"] }
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "process"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
rustdoc-types = "0.61.0"
zstd = "0.14.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
rust-mcp-types = { path = "crates/rust-mcp-types" }
rust-mcp-testing = { path = "crates/rust-mcp-testing" }
test-log = { version = "0.2.21", default-features = false, features = ["trace"] }

[workspace.lints.rust]
missing_docs = "warn"
unused_imports = "warn"

[workspace.lints.clippy]
unused_trait_names = "deny"
unwrap_in_result = "warn"
empty_loop = "deny"
