[workspace]
resolver = "3"
members = [
    "crates/*",
]

[workspace.dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.22.1"
cargo_toml = "0.22.3"
clap = { version = "4.6.1", features = ["derive", "env"] }
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
futures = "0.3"
metrics = "0.24.5"
metrics-exporter-prometheus = { version = "0.18.3", features = ["http-listener"] }
rmcp = { version = "1.6.0", features = ["transport-streamable-http-server"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "query", "rustls"] }
quote = "1.0.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.28"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "migrate"] }
syn = { version = "2.0.117", features = ["full"] }
tar = "0.4.45"
thiserror = "2.0.18"
tokio = { version = "1.50.1", features = ["macros", "rt-multi-thread", "signal", "process"] }
toml = "1.1.2"
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
rustdoc-types = "0.57.3"
zstd = "0.13.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
rust-mcp-types = { path = "crates/rust-mcp-types" }
rust-mcp-testing = { path = "crates/rust-mcp-testing" }
test-log = { version = "0.2.20", default-features = false, features = ["trace"] }

[workspace.lints.rust]
missing_docs = "warn"
unused_imports = "warn"

[workspace.lints.clippy]
unused_trait_names = "deny"
unwrap_in_result = "warn"
empty_loop = "deny"
